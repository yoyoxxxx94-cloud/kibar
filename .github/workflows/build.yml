
name: Build APK

on:
  push:
    paths:
      - 'kibar-proj.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q -o kibar-proj.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: kibar-proj
        run: gradle assembleDebug -PappVersionCode=${{ github.run_number }} --no-daemon --stacktrace

      - name: Collect APK
        run: cp kibar-proj/app/build/outputs/apk/debug/app-debug.apk app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kibar-apk
          path: app-debug.apk

      - name: Publish release (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app-debug.apk \
            --title "Kibar build ${{ github.run_number }}" \
            --notes "vc=${{ github.run_number }}" \
            --latest
